[project]
name = "hjepa-agent"
version = "0.1.0"
description = "An extendable agent following LeCun's autonomous machine intelligence architecture, built for agent_world."
requires-python = ">=3.13"
dependencies = [
    "agent-world",
    "stable-pretraining>=0.1.8",
    "stable-worldmodel>=0.1.1",
    "torch>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hjepa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
agent-world = { git = "https://github.com/kumar-selvakumaran/agent_world.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]

[tool.uv]
override-dependencies = ["pyglet>=2"]
link-mode = "hardlink"
cache-dir = ".uv-cache"
